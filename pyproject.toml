[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-stall-finder"
version = "0.1.0"
description = "Read-only diagnostic: find the WhatsApp Android records likely to stall a Move to iOS transfer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # Pinned on purpose: the decrypt layer was written against this exact API.
    "wa-crypt-tools==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Build-time only: used to produce the double-click apps. Not needed to run the tool.
app = ["pyinstaller>=6.10"]

[project.scripts]
wa-stall-finder = "wa_stall_finder.cli:entry_point"

[project.gui-scripts]
wa-stall-finder-gui = "wa_stall_finder.gui:entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
